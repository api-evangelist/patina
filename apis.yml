name: Patina
description: Patina was a technology-enabled primary care provider for adults 65 and
  older, delivering human, personalized, on-demand care through a mobile app that let
  patients chat or speak with their care team, view medical information, share photos
  and videos, ask questions, and schedule visits. Headquartered in Philadelphia, the
  venture-backed company (a16z, GV) has closed its clinical practice; patinahealth.com
  now serves as a records resource, with patient medical records maintained by custodian
  Morgan Records Management. Patina publishes no public API, developer portal, or SDKs.
